[package]
name = "precision-math"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "No-std deterministic oscillator math and reference artifact helpers"

[lib]
name = "precision_math"
path = "src/lib.rs"

[dependencies]
# Core is Zero-Dependency except for the shared fixed-point math crate.
geom-signal = { path = "../geom-signal" }

# Optional hashing dependency for named runtime/hash support.
sha2 = { version = "0.10.9", optional = true, default-features = false }

[dev-dependencies]
sha2 = "0.10.9"
hex = "0.4"
rppal = "0.22.1"
geom-spatial = { workspace = true }
# libm is needed for dev-tests (verification) but not for the library core.
libm = "0.2"

[features]
default = []
float-ingest = []
verification = []
audit = []
# Explicit opt-in support for std-backed verification/runtime hashing paths.
verification-runtime = ["dep:sha2"]
runtime-hash = ["verification-runtime"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
